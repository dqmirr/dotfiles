# Miasma Colorcheme
set $fg #d7c483
set $fg_gray #c2c2b0
set $bg #1c1c1c
set $black #000000
set $black_green #242d1d
set $black_yellow #43492a
set $brown #6e513a
set $red #82554b
set $green #5f875f
set $orange #a0623c
set $olive #78824b
set $yellow #fbec9f
set $gold #c9a554
set $gray #666666
set $gray_dark #444444

client.focused          $olive       $olive       $yellow  $olive       $olive
client.focused_inactive $bg          $bg          $fg_gray $bg          $bg
client.unfocused        $black       $black       $fg_gray $black       $black
client.urgent           $red         $black       $red     $red         $red
client.placeholder      $bg          $black       $fg_gray $bg          $bg
client.background       $black
